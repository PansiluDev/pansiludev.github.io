<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbon Footprint Calculator Plus (Metric)</title>
    <style>
        /* ---------- Body Reset & Background ---------- */
        
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #F7F6F7;
            text-align: center;
            line-height: 1.6;
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            /* dark overlay */
            z-index: -1;
        }
        /* ---------- Heading ---------- */
        
        h1 {
            font-size: 2.8rem;
            color: #FFD700;
            /* gold highlight */
            margin: 50px 0 20px 0;
        }
        /* ---------- Calculator Container ---------- */
        
        .calculator {
            background: rgba(255, 255, 255, 0.85);
            /* semi-transparent */
            backdrop-filter: blur(6px);
            /* subtle glass effect */
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            padding: 40px 30px;
            max-width: 900px;
            width: 90%;
            margin: 0 auto 50px auto;
            color: #000;
        }
        /* ---------- Sections ---------- */
        
        .section {
            margin-bottom: 35px;
            text-align: left;
        }
        
        .section h2 {
            font-size: 1.6rem;
            color: #00796B;
            /* green header */
            margin-bottom: 15px;
        }
        /* ---------- Labels & Inputs ---------- */
        
        label {
            display: block;
            margin-top: 10px;
            font-weight: 500;
        }
        
        input[type="number"],
        select {
            padding: 10px;
            width: 100%;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #cfd8dc;
            font-size: 1rem;
            box-sizing: border-box;
        }
        /* ---------- Button ---------- */
        
        button {
            padding: 12px 25px;
            background-color: #00BFA5;
            /* green */
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        
        button:hover {
            background-color: #00796B;
            transform: scale(1.05);
        }
        /* ---------- Results ---------- */
        
        .results {
            margin-top: 30px;
            padding: 25px;
            border-radius: 18px;
            background-color: rgba(224, 242, 241, 0.9);
            /* soft greenish background */
            width: 100%;
            box-sizing: border-box;
        }
        
        .results h2 {
            color: #00796B;
            margin-bottom: 20px;
        }
        /* ---------- Bars ---------- */
        
        #bars {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .bar-container {
            background-color: rgba(207, 216, 220, 0.3);
            border-radius: 10px;
            height: 20px;
            width: 100%;
        }
        
        .bar {
            height: 100%;
            border-radius: 10px;
            width: 0%;
            background-color: rgba(0, 191, 165, 0.6);
            transition: width 0.5s ease;
        }
        /* ---------- Tips & Total ---------- */
        
        #total,
        #tips {
            font-weight: 600;
            font-size: 1.1rem;
            margin-top: 10px;
        }
        /* ---------- Links ---------- */
        
        a {
            color: #00796B;
            text-decoration: none;
        }
        
        a:hover {
            color: #00BFA5;
            text-decoration: underline;
        }
        /* ---------- Responsive Layout ---------- */
        
        @media (max-width: 768px) {
            .calculator {
                padding: 30px 20px;
            }
            h1 {
                font-size: 2rem;
            }
            .section h2 {
                font-size: 1.3rem;
            }
            input[type="number"],
            select {
                font-size: 0.95rem;
            }
            button {
                font-size: 1rem;
                padding: 10px 20px;
            }
        }
    </style>
</head>

<body>

    <h1>🌱 Carbon Footprint Calculator Plus (Metric)</h1>
    <div class="calculator">

        <!-- Transportation -->
        <div class="section">
            <h2>Transportation</h2>
            <label>Annual kilometers driven by car (km):</label>
            <input type="number" id="carKm" min="0" value="0">
            <label>Fuel efficiency (L/100 km):</label>
            <input type="number" id="carL100" min="0.1" step="0.1" value="8">
            <label>Fuel type:</label>
            <select id="carFuel">
      <option value="gasoline">Gasoline</option>
      <option value="diesel">Diesel</option>
    </select>

            <label>Annual flight kilometers (km):</label>
            <input type="number" id="flightKm" min="0" value="0">
            <label>Flight class:</label>
            <select id="flightClass">
      <option value="economy">Economy</option>
      <option value="business">Business</option>
      <option value="first">First</option>
    </select>
        </div>

        <!-- Home Energy -->
        <div class="section">
            <h2>Home Energy</h2>
            <label>Average monthly electricity consumption (W):</label>
            <input type="number" id="electricity" min="0" value="0">
            <label>Natural Gas (m³/year):</label>
            <input type="number" id="naturalGas" min="0" value="0">
        </div>

        <!-- Diet -->
        <div class="section">
            <h2>Diet</h2>
            <label>Beef (kg/day):</label>
            <input type="number" id="beef" min="0" step="0.01" value="0">
            <label>Chicken (kg/day):</label>
            <input type="number" id="chicken" min="0" step="0.01" value="0">
            <label>Lamb (kg/day):</label>
            <input type="number" id="lamb" min="0" step="0.01" value="0">
            <label>Pork (kg/day):</label>
            <input type="number" id="pork" min="0" step="0.01" value="0">
            <label>Fish (kg/day):</label>
            <input type="number" id="fish" min="0" step="0.01" value="0">
            <label>Annual food waste (kg):</label>
            <input type="number" id="foodWaste" min="0" step="0.1" value="0">
        </div>

        <!-- Shopping -->
        <div class="section">
            <h2>Shopping</h2>
            <label>Annual cotton shirts:</label>
            <input type="number" id="cottonShirt" min="0" value="0">
            <label>Annual polyester shirts:</label>
            <input type="number" id="polyesterShirt" min="0" value="0">
            <label>Annual pants:</label>
            <input type="number" id="pants" min="0" value="0">
            <label>Annual jackets:</label>
            <input type="number" id="jackets" min="0" value="0">
            <label>Annual electronics recycled (kg):</label>
            <input type="number" id="electronics" min="0" value="0">
        </div>

        <button onclick="calculateFootprint()">Calculate Footprint</button>

        <div class="results" id="results" style="display:none;">
            <h2>💨 Your Carbon Footprint (kg CO₂/year)</h2>
            <div id="bars"></div>
            <p id="total"></p>
            <p id="tips"></p>
        </div>

    </div>

    <script src="script.js"></script>
    </script>
</body>

</html>
